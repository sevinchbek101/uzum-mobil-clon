<style>
:root{--p:#7000ff;--ps:#f1eaff;--y:#ffe14d;--sale:#e5374a;--fg:#1f1d2b;--mut:#f3f3f6;--mf:#7d7a8c;--bd:#e7e6ee;--outer:#ecebf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--outer);color:var(--fg);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:#fff;box-shadow:0 0 30px #0001;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#fff;padding-top:env(safe-area-inset-top)}
.city{display:flex;align-items:center;gap:4px;padding:12px 16px 0;font-size:14px;font-weight:500;width:100%}
.city small{margin-left:auto;color:var(--mf);font-size:12px;font-weight:400}

.promo{margin:4px 16px 0;border-radius:16px;padding:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#7000ff,#c23bd4 60%,#ffa63d)}
.promo h2{font-size:24px;line-height:1.15;margin-top:4px}.promo p{font-size:12px;opacity:.9}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 8px;padding:0 8px}
.card{min-width:0}.ph{position:relative}.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--mut)}
.fav{position:absolute;right:6px;top:6px;background:#fffc;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.fav svg{width:16px;height:16px}.fav.on svg{fill:var(--p);stroke:var(--p)}
.disc{position:absolute;left:6px;bottom:6px;background:var(--sale);color:#fff;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.info{padding:6px 4px 0;text-align:left;width:100%;display:block}
.ttl{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rate{font-size:11px;color:var(--mf);margin-top:4px}
.inst{display:inline-block;background:var(--y);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;margin-top:4px}
.old{font-size:11px;color:var(--mf);text-decoration:line-through;margin-top:4px}.price{font-size:14px;font-weight:600}
.btn{display:block;width:100%;background:var(--p);color:#fff;border-radius:12px;padding:12px;font-weight:500;text-align:center}
.btn.sm{font-size:12px;padding:6px;border-radius:8px;margin-top:6px}.btn:active{transform:scale(.97)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:10px;color:var(--mf);position:relative}
nav button.on{color:var(--p)}nav svg{width:24px;height:24px}
.badge{position:absolute;top:4px;right:22%;background:var(--p);color:#fff;font-size:10px;font-weight:600;border-radius:999px;padding:0 5px;min-width:16px}
.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd);padding:14px 0;width:100%;text-align:left;font-size:14px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--ps);display:grid;place-items:center;font-size:20px}
.pad{padding:0 16px}.mut{color:var(--mf)}
.empty{text-align:center;padding:64px 32px;color:var(--mf)}.empty .btn{display:inline-block;width:auto;padding:10px 24px;margin-top:16px}
.line{display:flex;gap:12px;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px}
.line img{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0}
.qty{display:flex;align-items:center;background:var(--mut);border-radius:8px}.qty button{padding:4px 10px;font-size:18px}
.sum{margin:16px;background:var(--mut);border-radius:12px;padding:16px;font-size:14px}.sum div{display:flex;justify-content:space-between;margin:4px 0}
.overlay{position:fixed;inset:0;background:#1f1d2b66;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet img.hero{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.close{position:absolute;right:12px;top:12px;background:#fffe;border-radius:50%;width:36px;height:36px;font-size:20px}
.note{background:#fff5c2;border:1px solid var(--y);border-radius:12px;padding:12px;font-size:14px}
.stat{background:var(--ps);border-radius:12px;padding:12px}
.demo{text-align:center;font-size:11px;color:var(--mf);margin:24px 16px}
</style>
</head>

else if(a==="clear")S.q="";

else if(a==="fav"){var i=S.favs.indexOf(id);i>-1?S.favs.splice(i,1):S.favs.push(id);save()}
else if(a==="add"){var l=S.cart.filter(function(x){return x.id===id})[0];l?l.qty++:S.cart.push({id:id,qty:1});save()}
else if(a==="inc"||a==="dec"){S.cart.forEach(function(x){if(x.id===id)x.qty+=a==="inc"?1:-1});S.cart=S.cart.filter(function(x){return x.qty>0});save()}
else if(a==="rm"){S.cart=S.cart.filter(function(x){return x.id!==id});save()}
else if(a==="checkout")S.checkout=1;else if(a==="order")S.checkout=2;
else if(a==="done"){S.cart=[];S.checkout=0;S.tab="home";save()}
render()});
render();
})();
